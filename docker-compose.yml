x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-pilketos}}
  DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-pilketos}}
  AUTH_SECRET: ${AUTH_SECRET:-change_me_32_chars_minimum_for_local}
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:6500}
  TOKEN_HMAC_SECRET: ${TOKEN_HMAC_SECRET:-change_me_32_chars_minimum_for_local}
  SUPABASE_URL: ${SUPABASE_URL:-https://xyzabcdef.supabase.co}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-placeholder}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-placeholder}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:6500}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
  GMAIL_FROM: ${GMAIL_FROM:-}
  GMAIL_SECONDARY_CLIENT_ID: ${GMAIL_SECONDARY_CLIENT_ID:-}
  GMAIL_SECONDARY_CLIENT_SECRET: ${GMAIL_SECONDARY_CLIENT_SECRET:-}
  GMAIL_SECONDARY_REFRESH_TOKEN: ${GMAIL_SECONDARY_REFRESH_TOKEN:-}
  GMAIL_SECONDARY_FROM: ${GMAIL_SECONDARY_FROM:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: pilketos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pilketos}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pilketos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      network: host
    container_name: pilketos-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    command: ["npm", "run", "db:deploy"]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      target: migrator
    container_name: pilketos-seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    command: ["npm", "run", "db:seed"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilketos-app
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      seed:
        condition: service_completed_successfully
    environment: *app-env
    ports:
      - "${APP_PORT:-6500}:6500"
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  pilketos_pgdata:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.31.50.0/24}
          gateway: ${DOCKER_GATEWAY:-172.31.50.1}
