x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set-a-strong-postgres-password}@postgres:5432/${POSTGRES_DB:-pilketos}
  DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set-a-strong-postgres-password}@postgres:5432/${POSTGRES_DB:-pilketos}
  AUTH_SECRET: ${AUTH_SECRET:?generate-with-openssl-rand-base64-32}
  NEXTAUTH_URL: ${NEXTAUTH_URL:?set-to-your-public-https-url}
  TOKEN_HMAC_SECRET: ${TOKEN_HMAC_SECRET:?generate-once-with-openssl-rand-hex-32}
  SUPABASE_URL: ${SUPABASE_URL:-https://xyzabcdef.supabase.co}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-placeholder}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-placeholder}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set-to-your-public-https-url}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
  GMAIL_FROM: ${GMAIL_FROM:-}
  GMAIL_SECONDARY_CLIENT_ID: ${GMAIL_SECONDARY_CLIENT_ID:-}
  GMAIL_SECONDARY_CLIENT_SECRET: ${GMAIL_SECONDARY_CLIENT_SECRET:-}
  GMAIL_SECONDARY_REFRESH_TOKEN: ${GMAIL_SECONDARY_REFRESH_TOKEN:-}
  GMAIL_SECONDARY_FROM: ${GMAIL_SECONDARY_FROM:-}
  TOKEN_EMAIL_SENDS_PER_MINUTE: ${TOKEN_EMAIL_SENDS_PER_MINUTE:-50}
  GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
  GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
  GOOGLE_SHEETS_SHEET_NAME: ${GOOGLE_SHEETS_SHEET_NAME:-Pilketos}
  GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_SHEETS_CLIENT_EMAIL:-}
  GOOGLE_SHEETS_PRIVATE_KEY: ${GOOGLE_SHEETS_PRIVATE_KEY:-}
  GOOGLE_SHEETS_PARENT_FOLDER_ID: ${GOOGLE_SHEETS_PARENT_FOLDER_ID:-}
  GOOGLE_SHEETS_SHARE_EMAIL: ${GOOGLE_SHEETS_SHARE_EMAIL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-a-strong-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-pilketos}
    volumes:
      - pilketos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    command: ["npm", "run", "db:deploy"]
    restart: "no"
    exclude_from_hc: true

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    command: ["npm", "run", "db:seed"]
    restart: "no"
    exclude_from_hc: true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      seed:
        condition: service_completed_successfully
    environment: *app-env
    expose:
      - "6500"
    ports:
      - "${APP_PORT:-6500}:6500"
    volumes:
      - pilketos_uploads:/app/public/uploads

volumes:
  pilketos_pgdata:
  pilketos_uploads:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"
